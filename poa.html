<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ייפוי כוח — עו"ד ערן בן שושן</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ייפוי כוח">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2d1b69">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#e2e5e9;direction:rtl}
.topbar{background:#2d1b69;color:#fff;padding:12px 24px;font-size:17px;font-weight:bold;
  text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.wrap{display:flex;gap:20px;padding:18px 20px;max-width:1540px;margin:0 auto;align-items:flex-start}
.fp{width:310px;min-width:290px;background:#fff;border-radius:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);position:sticky;top:54px;
  max-height:calc(100vh - 70px);overflow-y:auto;padding-bottom:14px}
.sh{background:#ede8f6;color:#2d1b69;padding:6px 14px;font-size:11.5px;font-weight:bold}
.fg{padding:0 14px}
.fg label{display:block;font-size:11px;color:#444;margin:7px 0 2px;font-weight:bold}
.fg input[type=text],.fg textarea{width:100%;padding:5px 8px;border:1px solid #ccc;
  border-radius:4px;font-size:12px;direction:rtl;font-family:Arial,sans-serif;color:#111;background:#fff}
.fg textarea{resize:vertical;min-height:58px;line-height:1.5}
.fg input:focus,.fg textarea:focus{border-color:#2d1b69;outline:none}
.qbtn{display:inline-block;margin:2px 2px;padding:4px 8px;background:#ede8f6;
  color:#2d1b69;border:1px solid #c0a8e8;border-radius:4px;font-size:10.5px;
  cursor:pointer;font-family:Arial,sans-serif}
.qbtn:hover{background:#d4c5f0}
.btn-g,.btn-r{display:block;width:calc(100% - 28px);margin:8px 14px 3px;
  border:none;border-radius:6px;cursor:pointer;font-family:Arial,sans-serif;font-weight:bold;color:#fff}
.btn-g{background:#27ae60;padding:9px;font-size:13px}
.btn-g:hover{background:#219150}
.btn-r{background:#2d1b69;padding:12px;font-size:14px}
.btn-r:hover{background:#1a0f40}
.stat{font-size:11px;color:#666;text-align:center;min-height:14px;margin:2px 14px}
.stat.ok{color:#27ae60}.stat.err{color:#c0392b}
.pp{flex:1;background:#c5c8cc;padding:20px;border-radius:8px;overflow:auto;min-width:0}
.pp-ttl{text-align:center;color:#555;margin:0 0 14px;font-size:12.5px;font-weight:normal}
.pp-ctr{display:flex;justify-content:center}
#form-preview{position:relative;width:794px;background:#fff;box-shadow:0 4px 28px rgba(0,0,0,.4);display:inline-block}
#pdf-bg{display:block;width:794px;height:auto}
.fld{position:absolute;display:flex;align-items:center;
  direction:rtl;font-family:'Frank Ruhl Libre','Times New Roman',serif;
  font-size:10.5pt;font-weight:bold;color:#1a3fa8;overflow:visible;
  white-space:nowrap;pointer-events:none;line-height:1}
#mob-preview-btn{display:none}
@media screen and (max-width:768px){
  body{background:#e2e5e9}
  .topbar{font-size:14px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  .wrap{flex-direction:column;padding:10px;gap:10px}
  .fp{width:100%!important;min-width:unset!important;position:static!important;
    max-height:unset!important;border-radius:8px}
  .fg input[type=text],.fg textarea{padding:10px;font-size:15px;min-height:44px}
  .btn-g{padding:13px;font-size:15px}
  .btn-r{padding:14px;font-size:16px}
  #mob-preview-btn{display:block;width:calc(100% - 28px);margin:6px 14px 2px;
    padding:11px;border:none;border-radius:6px;background:#2d1b69;color:#fff;
    font-size:14px;font-family:Arial,sans-serif;font-weight:bold;cursor:pointer}
  .pp{display:none}
  .pp.mob-show{display:block}
  .pp-ctr{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #form-preview{transform-origin:top center}
}
@media print{
  .topbar,.fp{display:none!important}
  body{background:#fff!important}
  .wrap{display:block!important;padding:0!important;margin:0!important}
  .pp{display:block!important;background:#fff!important;padding:0!important;border-radius:0!important}
  .pp-ttl{display:none!important}
  .pp-ctr{display:block!important;line-height:0!important}
  #form-preview{display:block!important;box-shadow:none!important;margin:0!important;width:210mm!important;transform:none!important;zoom:1!important;overflow:hidden!important}
  #pdf-bg{width:210mm!important;height:297mm!important}
  #form-preview,#pdf-bg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fld{font-size:10pt!important;color:#1a3fa8!important}
  @page{size:A4 portrait;margin:0}
  html,body{margin:0!important;padding:0!important}
}
</style>
</head>
<body>
<div class="topbar">ייפוי כוח — עו"ד ערן בן שושן</div>
<div class="wrap">
<div class="fp">
  <div class="sh">פרטי המייפה</div>
  <div class="fg">
    <label>שם מלא</label>
    <input type="text" id="p_name" placeholder="שם פרטי ושם משפחה" oninput="sync()">
    <label>מספר ת.ז.</label>
    <input type="text" id="p_id" placeholder="9 ספרות" oninput="formatID(this)" maxlength="9" inputmode="numeric">
    <div class="stat" id="id-stat"></div>
    <label>מהות השירות (אחרי "ל")</label>
    <textarea id="p_service" rows="3" placeholder="לדוגמה: ליישוב סכסוך / להגשת תביעה למזונות..." oninput="sync()"></textarea>
    <div style="margin:4px 0 6px">
      <span class="qbtn" onclick="addService('ליישוב סכסוך')">ליישוב סכסוך</span>
      <span class="qbtn" onclick="addService('להגשת תביעה למזונות')">למזונות</span>
      <span class="qbtn" onclick="addService('לטיפול בענייני גירושין')">לגירושין</span>
      <span class="qbtn" onclick="addService('לטיפול בכל ענייני הרכוש והשהות')">לרכוש ושהות</span>
      <span class="qbtn" onclick="addService('לטיפול בכל הענייניים בתחום המשפחה לרבות מזונות, שהות, רכוש וגירושין')">הכל</span>
    </div>
    <label>תאריך</label>
    <input type="text" id="p_date" placeholder="dd/mm/yyyy" oninput="sync()">
  </div>
  <div class="sh" style="margin-top:8px">חילוץ אוטומטי</div>
  <div class="fg">
    <label>הדבק טקסט — יחלץ שם ות.ז. אוטומטית</label>
    <textarea id="extract-input" rows="3" placeholder="הדבק טקסט המכיל שם ומספר ת.ז. (9 ספרות)..." style="font-size:11px"></textarea>
    <div style="display:flex;gap:6px;margin:5px 0 2px">
      <button class="btn-g" style="flex:1;font-size:12px;margin:0" onclick="extractFromText()">🔍 חלץ</button>
      <button class="btn-g" style="flex:1;font-size:12px;margin:0;background:#2d1b69" onclick="$('extract-file').click()">📄 קובץ</button>
    </div>
    <input type="file" id="extract-file" accept=".txt,.rtf,.text" style="display:none" onchange="extractFromFile(this)">
    <div class="stat" id="extract-stat"></div>
  </div>
  <div id="lawyer-tools">
    <div class="sh" style="margin-top:8px">שליחה ב-WhatsApp</div>
    <div class="fg">
      <label>טלפון לקוח (לשליחה ב-WhatsApp)</label>
      <input type="text" id="p_phone" placeholder="05XXXXXXXX" inputmode="tel" oninput="sync()">
      <button class="btn-g" style="background:#25d366;margin-top:6px" onclick="shareViaWhatsApp()">📲 שלח ללקוח ב-WhatsApp</button>
      <button class="btn-g" style="background:#c97a00;margin-top:4px;font-size:11px" onclick="shareSigLink()">🔗 העתק קישור לחתימה</button>
      <div class="stat" id="share-stat"></div>
    </div>
  </div>
  <div class="sh" style="margin-top:8px">חתימה דיגיטלית</div>
  <div class="fg">
    <button class="btn-g" style="background:#1a6b3a;margin-top:8px" onclick="openSig('p')">✍ חתימת הלקוח</button>
    <div class="stat" id="sig-stat"></div>
  </div>
  <button class="btn-r" onclick="exportPDF()" style="margin-top:10px">⬇ ייצא PDF</button>
  <div class="stat" id="pdf-stat"></div>
</div>

<button id="mob-preview-btn" onclick="toggleMobPreview()">👁 הצג תצוגה מקדימה</button>

<div class="pp">
  <p class="pp-ttl">תצוגה מקדימה — A4 | לחץ "ייצא PDF" לשמירה</p>

<script>
const $=id=>document.getElementById(id);
const v=id=>($(id)||{}).value||'';

function addService(txt){
  const el=$('p_service');
  el.value=el.value?el.value+' / '+txt:txt;
  sync();
}

// ── Israeli ID validation (Luhn-style) ──
function validateIsraeliID(id){
  if(!/^\d{9}$/.test(id))return false;
  let sum=0;
  for(let i=0;i<9;i++){let d=+id[i]*((i%2)+1);if(d>9)d-=9;sum+=d;}
  return sum%10===0;
}

function formatID(el){
  const digits=el.value.replace(/\D/g,'').slice(0,9);
  el.value=digits;
  sync();
  if(digits.length===9){
    const ok=validateIsraeliID(digits);
    showStat('id-stat',ok?'✓ ת.ז. תקינה':'⚠ ספרת ביקורת שגויה',ok?'ok':'err');
  }else{showStat('id-stat','','');}
}

// ── Extract name & ID from pasted text ──
function extractFromText(){
  const text=v('extract-input');
  const idMatch=text.match(/\d{9}/);
  if(!idMatch){showStat('extract-stat','לא נמצא מספר ת.ז. (9 ספרות) בטקסט','err');return;}
  const rawID=idMatch[0];
  $('p_id').value=rawID;
  // Find name: text before the ID, after last comma or newline
  const before=text.slice(0,text.indexOf(rawID)).replace(/[,.:;\s]+$/,'').replace(/ת\.?\s*ז\.?\s*$/,'').trim();
  const parts=before.split(/[\s,.:;]+/).filter(Boolean);
  if(parts.length>0){
    const name=parts.slice(-3).join(' ');
    $('p_name').value=name;
  }
  const ok=validateIsraeliID(rawID);
  showStat('id-stat',ok?'✓ ת.ז. תקינה':'⚠ ספרת ביקורת שגויה',ok?'ok':'err');
  sync();
  showStat('extract-stat','✓ שם ות.ז. חולצו בהצלחה','ok');
  setTimeout(()=>showStat('extract-stat','',''),4000);
}

function sync(){
  const name=v('p_name');
  const rawID=v('p_id').replace(/\D/g,'').slice(0,9);
  const displayID=rawID?' '+rawID+' ':'';
  const svc=v('p_service'),date=v('p_date');
  $('ov-name').textContent=name;
  $('ov-id').textContent=displayID;
  // Split service across 3 lines (9pt in ~414px ≈ 52 chars/line, subsequent ~60)
  const L1=52, L2=60, L3=60;
  function splitAt(str,n){
    if(str.length<=n)return[str,''];
    let i=n;
    while(i>0&&str[i]!==' ')i--;
    if(i===0)i=n;
    return[str.slice(0,i).trim(),str.slice(i).trim()];
  }
  const [line1,rest1]=splitAt(svc,L1);
  const [line2,rest2]=splitAt(rest1,L2);
  const line3=rest2.slice(0,L3);
  $('ov-svc1').textContent=line1;
  $('ov-svc2').textContent=line2;
  $('ov-svc3').textContent=line3;
  $('ov-date').textContent=date;
}

// ── Auto-fill today's date ──
(function(){
  const d=new Date();
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  const today=dd+'/'+mm+'/'+yyyy;
  window.addEventListener('DOMContentLoaded',()=>{
    const el=$('p_date');if(el&&!el.value)el.value=today;
    _checkHash();
    sync();
  });
})();

// ── Signature ──
let _sigRole='p',_sigP='',_sigR='';
function applySig(role,url){
  if(role==='p')_sigP=url;else _sigR=url;
  const ov=$('ov-sig-'+role);
  ov.innerHTML='<img src="'+url+'" style="width:100%;height:100%;object-fit:contain;display:block">';
  ov.style.cursor='pointer';ov.style.pointerEvents='auto';
  ov.onclick=()=>openSig(role);
  closeSigModal();showStat('sig-stat','✓ חתימה נשמרה — לחץ לתיקון','ok');
  setTimeout(()=>showStat('sig-stat','',''),4000);
}
function trimmedDataURL(canvas){
  const ctx=canvas.getContext('2d');
  const id=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=id.data,w=canvas.width,h=canvas.height;
  let x0=w,x1=0,y0=h,y1=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>10){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}}
  if(x1<x0)return canvas.toDataURL('image/png');
  const pad=3,tw=x1-x0+pad*2,th=y1-y0+pad*2;
  const tmp=document.createElement('canvas');tmp.width=tw;tmp.height=th;
  tmp.getContext('2d').drawImage(canvas,x0-pad,y0-pad,tw,th,0,0,tw,th);
  return tmp.toDataURL('image/png');
}
function uploadSigImage(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){applySig(_sigRole,e.target.result);};
  reader.readAsDataURL(file);input.value='';
}
function openSig(role){_sigRole=role;$('sig-title').textContent='חתימת הלקוח';clearSigCanvas();$('sig-modal').style.display='flex';}
function closeSigModal(){$('sig-modal').style.display='none';}
function clearSigCanvas(){const c=$('sig-canvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);}
function saveSig(){
  const c=$('sig-canvas'),ctx=c.getContext('2d');
  const d=ctx.getImageData(0,0,c.width,c.height).data;
  if(!d.some(v=>v<250&&v>0)){showStat('sig-stat','יש לצייר חתימה תחילה','err');return;}
  applySig(_sigRole,trimmedDataURL(c));
}
(function(){
  let drawing=false,lx=0,ly=0;
  function sc(c){const r=c.getBoundingClientRect();return{x:c.width/r.width,y:c.height/r.height};}
  window.addEventListener('load',()=>{
    const c=document.getElementById('sig-canvas');if(!c)return;
    c.addEventListener('pointerdown',e=>{drawing=true;const s=sc(c);lx=(e.clientX-c.getBoundingClientRect().left)*s.x;ly=(e.clientY-c.getBoundingClientRect().top)*s.y;c.setPointerCapture(e.pointerId);e.preventDefault();});
    c.addEventListener('pointermove',e=>{
      if(!drawing)return;
      const s=sc(c),r=c.getBoundingClientRect();
      const x=(e.clientX-r.left)*s.x,y=(e.clientY-r.top)*s.y;
      const ctx=c.getContext('2d');
      ctx.strokeStyle='#1a3fa8';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();
      lx=x;ly=y;
    });
    c.addEventListener('pointerup',()=>drawing=false);
    c.addEventListener('pointercancel',()=>drawing=false);
  });
})();

function showStat(id,msg,cls){const el=$(id);if(!el)return;el.textContent=msg;el.className='stat'+(cls?' '+cls:'');}

async function exportPDF(){

// ── WhatsApp state encode/decode ──
function encodeState(){
  const s={};
  const fields={p_name:'n',p_id:'i',p_service:'s',p_date:'d',p_phone:'ph'};
  Object.entries(fields).forEach(([id,k])=>{const val=v(id);if(val)s[k]=val;});
  return btoa(unescape(encodeURIComponent(JSON.stringify(s))));
}
function decodeState(enc){
  try{
    const s=JSON.parse(decodeURIComponent(escape(atob(enc))));
    const map={n:'p_name',i:'p_id',s:'p_service',d:'p_date',ph:'p_phone'};
    Object.entries(map).forEach(([k,id])=>{if(k in s&&$(id))$(id).value=s[k];});
    sync();
    _enterClientMode();
  }catch(e){console.error('decodeState:',e);}
}
function _enterClientMode(){
  const lt=$('lawyer-tools');if(lt)lt.style.display='none';
  const mpb=$('mob-preview-btn');if(mpb)mpb.style.display='none';
  const svp=$('ov-sig-p');
  if(svp&&!svp.querySelector('img')){
    svp.style.pointerEvents='auto';svp.style.cursor='pointer';
    svp.style.border='2px dashed #1a6b3a';svp.style.borderRadius='4px';
    svp.innerHTML='<span style="color:#1a6b3a;font-size:11px;font-family:Arial;font-weight:normal">✍ לחץ לחתימה</span>';
    svp.onclick=()=>{svp.innerHTML='';svp.style.border='';svp.style.cursor='';svp.style.pointerEvents='none';openSig('p');};
  }
  if(!$('sign-banner')){
    const b=document.createElement('div');b.id='sign-banner';
    b.style.cssText='background:#1a6b3a;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;direction:rtl;text-align:center;line-height:1.5';
    b.innerHTML='✍ מצב חתימה<br><span style="font-size:11px;opacity:.85">לחץ "✍ לחץ לחתימה" בטופס, חתום ואז לחץ שלח</span>';
    const fp=document.querySelector('.fp');if(fp)fp.prepend(b);
  }
  if(!$('_float-send')){
    const fb=document.createElement('button');fb.id='_float-send';
    fb.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1a6b3a;color:#fff;border:none;border-radius:12px;padding:15px 28px;font-size:15px;font-weight:bold;cursor:pointer;z-index:1500;box-shadow:0 4px 18px rgba(0,0,0,.35);font-family:Arial,sans-serif;direction:rtl;white-space:nowrap';
    fb.textContent='✅ שלח PDF לעורך הדין';fb.onclick=confirmAndSend;
    document.body.appendChild(fb);
  }
  const pp=document.querySelector('.pp');
  if(pp){pp.classList.add('mob-show');const scale=Math.min(1,(window.innerWidth-20)/794);const fpr=$('form-preview');if(fpr)fpr.style.zoom=scale;}
}

async function confirmAndSend(){

  showStat('sig-stat','מייצר PDF...','');
  try{

    const savedZoom=fp.style.zoom;
    const ppHidden=getComputedStyle(pp).display==='none';
    if(ppHidden){pp.style.position='fixed';pp.style.top='-9999px';pp.style.left='0';pp.style.display='block';}
    fp.style.zoom='';
    await new Promise(r=>setTimeout(r,80));

    fp.style.zoom=savedZoom;
    if(ppHidden){pp.style.position='';pp.style.top='';pp.style.left='';pp.style.display='';}

    const file=new File([pdfBlob],'יפוי-כוח-'+clientName+'-חתום.pdf',{type:'application/pdf'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({title:'ייפוי כוח חתום',text:'שלום עו"ד ערן, חתמתי על ייפוי כוח.',files:[file]});showStat('sig-stat','הקובץ נשלח ✓','ok');return;}
      catch(se){if(se.name==='AbortError')return;}
    }
    const burl=URL.createObjectURL(pdfBlob);
    const a=document.createElement('a');a.href=burl;a.download='יפוי-כוח-'+clientName+'-חתום.pdf';document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(burl),8000);

}

function _checkHash(){

function extractFromFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const ta=$('extract-input');if(ta)ta.value=e.target.result;
    extractFromText();
  };
  reader.readAsText(file,'UTF-8');
  input.value='';
}
