<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ייפוי כוח — עו"ד ערן בן שושן</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ייפוי כוח">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#7c3aed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>if(window['pdfjs-dist/build/pdf']){window.pdfjsLib=window['pdfjs-dist/build/pdf'];pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#6d28d9;--ink-deep:#5b21b6;--gold:#ec4899;--gold-soft:#fbcfe8;--cream:#faf5ff;--cream-deep:#f3e8ff;--surface:#ffffff;--border:#e9d5ff;--grad:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%)}
body{font-family:'David Libre',Arial,sans-serif;font-size:13px;background:var(--cream);color:#3b0764;direction:rtl;line-height:1.6}
.topbar{background:var(--grad);color:#fff;padding:16px 24px;font-size:19px;font-weight:bold;letter-spacing:0.4px;
  text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 3px 12px rgba(124,58,237,.35);font-family:'David Libre',Arial,sans-serif}
.wrap{display:flex;gap:20px;padding:18px 20px;max-width:680px;margin:0 auto;align-items:flex-start}
.fp{width:100%;background:var(--surface);border-radius:14px;border:1px solid var(--border);
  box-shadow:0 6px 24px rgba(124,58,237,.10);padding-bottom:14px;overflow:hidden}
.sh{background:var(--cream-deep);color:var(--ink);padding:9px 14px;font-size:14px;font-weight:bold;border-right:4px solid var(--gold);font-family:'David Libre',Arial,sans-serif}
.fg{padding:0 14px}
.fg label{display:block;font-size:13px;color:var(--ink);margin:8px 0 3px;font-weight:bold;font-family:'David Libre',Arial,sans-serif}
.fg input[type=text],.fg input[type=password],.fg textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);
  border-radius:8px;font-size:14px;direction:rtl;font-family:'David Libre',Arial,sans-serif;color:#3b0764;background:#fff;line-height:1.5}
.fg textarea{resize:vertical;min-height:58px;line-height:1.5}
.fg input:focus,.fg textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(236,72,153,.18)}
.qbtn{display:inline-block;margin:2px 2px;padding:7px 12px;background:var(--cream-deep);
  color:var(--ink);border:1.5px solid var(--border);border-radius:8px;font-size:13px;
  cursor:pointer;-webkit-appearance:none;appearance:none;font-family:'David Libre',Arial,sans-serif;transition:all .15s}
.qbtn:hover,.qbtn:active{background:var(--gold-soft);border-color:var(--gold);color:#9d174d}
.qbtn.sv1{background:#7c3aed;color:#fff;border-color:#7c3aed}
.qbtn.sv2{background:#ec4899;color:#fff;border-color:#ec4899}
.qbtn.sv3{background:#f59e0b;color:#fff;border-color:#f59e0b}
.qbtn.sv4{background:#06b6d4;color:#fff;border-color:#06b6d4}
.qbtn.sv5{background:#10b981;color:#fff;border-color:#10b981}
.qbtn[class*=sv]:hover,.qbtn[class*=sv]:active{filter:brightness(1.1);color:#fff}
.btn-g,.btn-r{display:block;width:calc(100% - 28px);margin:8px 14px 3px;
  border:none;border-radius:10px;cursor:pointer;font-family:'David Libre',Arial,sans-serif;font-weight:bold;color:#fff;font-size:14px;transition:all .15s}
.btn-g{background:#7c3aed;padding:12px;box-shadow:0 3px 10px rgba(124,58,237,.25)}
.btn-g:hover{background:#6d28d9;transform:translateY(-1px)}
.btn-r{background:var(--grad);padding:14px;box-shadow:0 4px 14px rgba(236,72,153,.30)}
.btn-r:hover{filter:brightness(1.08);transform:translateY(-1px)}
.stat{font-size:12.5px;color:#9333ea;text-align:center;min-height:14px;margin:2px 14px;font-family:'David Libre',Arial,sans-serif}
.stat.ok{color:#059669}.stat.err{color:#e11d48}
.file-badge{display:inline-flex;align-items:center;background:var(--cream-deep);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:5px 6px 5px 11px;margin:4px 0;font-size:12.5px}
.file-badge button{margin-right:8px;min-width:26px;min-height:26px;border:none;background:transparent;color:#8a7a64;border-radius:50%;font-size:14px;font-weight:bold;cursor:pointer}
.file-badge button:hover{background:#fdecec;color:#c0392b}
@media screen and (max-width:768px){
  .topbar{font-size:17px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
  .wrap{padding:10px;gap:10px}
  .fg input[type=text],.fg input[type=password],.fg textarea{padding:11px;font-size:15px;min-height:44px}
  .fg label{font-size:14px}
  .sh{font-size:15px}
  .btn-g{padding:13px;font-size:15px;min-height:46px}
  .btn-r{padding:14px;font-size:15px;min-height:46px}
  .qbtn{font-size:14px;padding:9px 13px}
}
</style>

<body>
<div class="topbar">ייפוי כוח — עו"ד ערן בן שושן</div>
<div class="wrap">
<div class="fp">
  <div class="sh">פרטי המייפה</div>
  <div class="fg">
    <label>שם מלא</label>
    <input type="text" id="p_name" placeholder="שם פרטי ושם משפחה" oninput="sync()">
    <label>מספר ת.ז.</label>
    <input type="text" id="p_id" placeholder="9 ספרות" oninput="formatID(this)" maxlength="9" inputmode="numeric">
    <div class="stat" id="id-stat"></div>
    <label>מהות השירות (אחרי "ל")</label>
    <input type="text" id="p_service" placeholder="לדוגמה: ליישוב סכסוך" oninput="sync()">
    <div style="margin:4px 0 6px">
      <button type="button" class="qbtn sv1" onclick="addService('ליישוב סכסוך')">ליישוב סכסוך</button>
      <button type="button" class="qbtn sv2" onclick="addService('להגשת תביעה למזונות')">למזונות</button>
      <button type="button" class="qbtn sv3" onclick="addService('לטיפול בענייני גירושין')">לגירושין</button>
      <button type="button" class="qbtn sv4" onclick="addService('לטיפול בכל ענייני הרכוש והשהות')">לרכוש ושהות</button>
      <button type="button" class="qbtn sv5" onclick="addService('לטיפול בכל הענייניים בתחום המשפחה לרבות מזונות, שהות, רכוש וגירושין')">הכל</button>
    </div>
    <label>תאריך</label>
    <input type="text" id="p_date" placeholder="dd/mm/yyyy" oninput="sync()">
  </div>
  <div class="sh" style="margin-top:8px">חילוץ אוטומטי</div>
  <div class="fg">
    <label>הדבק טקסט — יחלץ שם ות.ז. אוטומטית</label>
    <textarea id="extract-input" rows="3" placeholder="הדבק טקסט המכיל שם ומספר ת.ז. (9 ספרות)..."></textarea>
    <div style="display:flex;gap:6px;margin:5px 0 2px">
      <button type="button" class="btn-g" style="flex:1;margin:0" onclick="extractFromText()">🔍 חלץ פרטים</button>
      <button type="button" class="btn-g" style="flex:1;margin:0;background:var(--gold);color:#fff" onclick="$('extract-file').click()">📎 העלה קובץ</button>
    </div>
    <input type="file" id="extract-file" accept=".txt,.rtf,.text,.pdf,image/*" style="display:none" onchange="extractFromFile(this)">
    <div id="poa-file-badge" style="display:none"></div>
    <div class="stat" id="extract-stat"></div>
  </div>
  <div class="sh" style="margin-top:8px">⚙ חילוץ חכם עם בינה מלאכותית (Gemini)</div>
  <div class="fg">
    <label>מפתח Gemini API — חד-פעמי, נשמר במכשירך בלבד</label>
    <input type="password" id="poa_gemini_key" placeholder="AIzaSy..." style="direction:ltr;font-family:monospace">
    <div style="display:flex;gap:6px;margin:6px 0 2px">
      <button type="button" class="btn-g" style="flex:1;margin:0" onclick="_saveGeminiKey()">💾 שמור מפתח</button>
      <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" class="btn-g" style="flex:1;margin:0;background:var(--gold);color:#fff;text-decoration:none;text-align:center;line-height:2.1">🔑 קבל מפתח חינמי</a>
    </div>
    <div class="stat" id="gemini-key-stat"></div>
  </div>
  <div id="lawyer-tools">
    <div class="sh" style="margin-top:8px">שליחה ב-WhatsApp</div>
    <div class="fg">
      <button class="btn-g" style="background:#25d366;margin-top:6px" onclick="shareViaWhatsApp('')">📲 פתח WhatsApp ובחר איש קשר</button>
      <label style="margin-top:10px">או — שלח למספר ספציפי</label>
      <input type="text" id="p_phone" placeholder="05XXXXXXXX" inputmode="tel">
      <button class="btn-g" style="background:#128c7e;margin-top:6px" onclick="shareViaWhatsApp($('p_phone').value)">💬 שלח למספר שהוקלד</button>
      <button class="btn-g" style="background:#c97a00;margin-top:6px;font-size:11px" onclick="shareSigLink()">🔗 העתק קישור לחתימה</button>
      <div class="stat" id="share-stat"></div>
    </div>
  </div>
  <div class="sh" style="margin-top:8px">חתימה דיגיטלית</div>
  <div class="fg">
    <button class="btn-g" style="background:#1a6b3a;margin-top:8px" onclick="openSig('p')">✍ חתימת הלקוח</button>
    <div class="stat" id="sig-stat"></div>
  </div>
  <button class="btn-r" onclick="exportPDF()" style="margin-top:10px">⬇ ייצא PDF</button>
  <div class="stat" id="pdf-stat"></div>
</div>
</div>

<div id="sig-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:2000;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:20px;width:90%;max-width:420px;margin:0 auto;box-sizing:border-box;direction:rtl;font-family:'David Libre',Arial,sans-serif">
    <div style="font-weight:bold;font-size:15px;color:#7c3aed;margin-bottom:10px" id="sig-title">חתימת הלקוח</div>
    <div style="font-size:11px;color:#888;margin-bottom:6px">צייר את חתימתך בתיבה:</div>
    <canvas id="sig-canvas" width="700" height="300" style="border:2px solid #d4c9b8;border-radius:8px;touch-action:none;cursor:crosshair;background:#fdfbf7;display:block;width:100%;height:180px"></canvas>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button onclick="clearSigCanvas()" style="background:#aaa;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px">נקה</button>
      <button onclick="saveSig()" style="background:#1a6b3a;color:#fff;border:none;border-radius:6px;padding:8px 18px;cursor:pointer;font-size:13px;font-weight:bold">שמור ✓</button>
      <button onclick="$('sig-upload-input').click()" style="background:#7c3aed;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px">📁 העלה תמונה</button>
      <input type="file" id="sig-upload-input" accept="image/*" style="display:none" onchange="uploadSigImage(this)">
      <button onclick="closeSigModal()" style="background:#e55;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px">ביטול</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const v=id=>($(id)||{}).value||'';
function sync(){}

function addService(txt){
  const el=$('p_service');
  el.value=el.value?el.value+' / '+txt:txt;
}

function validateIsraeliID(id){
  if(!/^\d{9}$/.test(id))return false;
  let sum=0;
  for(let i=0;i<9;i++){let d=+id[i]*((i%2)+1);if(d>9)d-=9;sum+=d;}
  return sum%10===0;
}

function formatID(el){
  const digits=el.value.replace(/\D/g,'').slice(0,9);
  el.value=digits;
  if(digits.length===9){
    const ok=validateIsraeliID(digits);
    showStat('id-stat',ok?'✓ ת.ז. תקינה':'⚠ ספרת ביקורת שגויה',ok?'ok':'err');
  }else{showStat('id-stat','','');}
}

// === Gemini AI extraction (optional) ===
// Model fallback chain: try newest first, fall back if it returns 404/503.
const GEMINI_MODELS=['gemini-3.5-flash','gemini-2.5-flash'];
async function _fetchWithTimeout(url,opts,timeoutMs){
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),timeoutMs);
  try{return await fetch(url,{...opts,signal:ctrl.signal});}
  finally{clearTimeout(tid);}
}
function _parseJsonLoose(raw){
  let t=(raw||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a>=0&&b>a)t=t.slice(a,b+1);
  return JSON.parse(t);
}
function _buildPoaPrompt(text){
  const doc=text.length>8000?text.slice(0,8000):text;
  return `חלץ מטקסט ייפוי כוח את הפרטים ל-JSON. שדות: name (שם מלא), id (ת.ז. 9 ספרות), service (מהות השירות המשפטי, אחרי המילה "ל"), date (dd/mm/yyyy).
החזר JSON תקין בלבד. דלג על שדה שאינו במסמך. name = שם פרטי+משפחה בלבד, ללא ספרות/"ת.ז."/"מספר". id = 9 ספרות בלבד.
דוגמה: "דוד כהן ת.ז. 123456789 ליישוב סכסוך" → {"name":"דוד כהן","id":"123456789","service":"ליישוב סכסוך"}
טקסט:
${doc}`;
}
async function extractWithGemini(text){
  const key=(localStorage.getItem('poa_gemini_key')||'').trim();
  if(!key)return null;
  const prompt=_buildPoaPrompt(text);
  let lastErr;
  for(const model of GEMINI_MODELS){
    try{
      const r=await _fetchWithTimeout(
        'https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key),
        {method:'POST',headers:{'Content-Type':'application/json'},
         body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
           generationConfig:{temperature:0.1,maxOutputTokens:1024,responseMimeType:'application/json'}})},
        20000);
      if(r.status===404||r.status===503){lastErr=new Error(model+' '+r.status);console.warn('[Gemini] '+model+' unavailable ('+r.status+'), trying next');continue;}
      if(!r.ok){throw new Error('Gemini '+r.status);}
      const data=await r.json();
      const raw=(data&&data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0].text)||'';
      console.log('[Gemini] extracted via '+model);
      return _parseJsonLoose(raw);
    }catch(e){lastErr=e;if(e.name==='AbortError')throw e;}
  }
  throw lastErr||new Error('all Gemini models failed');
}

// Local regex extraction (fallback / no-key path)
function _extractLocal(text){
  const idMatch=text.match(/\d{9}/);
  if(!idMatch)return null;
  const rawID=idMatch[0];
  const before=text.slice(0,text.indexOf(rawID)).replace(/[,.:;\s]+$/,'').replace(/ת\.?\s*ז\.?\s*$/,'').trim();
  const parts=before.split(/[\s,.:;]+/).filter(Boolean);
  return {id:rawID,name:parts.length>0?parts.slice(-3).join(' '):''};
}

async function extractFromText(){
  const text=v('extract-input');
  if(!text.trim()){showStat('extract-stat','אין טקסט לחילוץ','err');return;}
  const hasKey=!!(localStorage.getItem('poa_gemini_key')||'').trim();
  // Try Gemini first if a key is configured
  if(hasKey){
    showStat('extract-stat','מחלץ עם בינה מלאכותית...','');
    try{
      const g=await extractWithGemini(text);
      if(g&&(g.name||g.id||g.service)){
        if(g.name)$('p_name').value=String(g.name).trim();
        if(g.id){const d=String(g.id).replace(/\D/g,'').slice(0,9);if(d)$('p_id').value=d;}
        if(g.service)$('p_service').value=String(g.service).trim();
        if(g.date&&$('p_date'))$('p_date').value=String(g.date).trim();
        if($('p_id').value.length===9){const ok=validateIsraeliID($('p_id').value);showStat('id-stat',ok?'✓ ת.ז. תקינה':'⚠ ספרת ביקורת שגויה',ok?'ok':'err');}
        showStat('extract-stat','✓ הפרטים חולצו (Gemini)','ok');
        setTimeout(()=>showStat('extract-stat','',''),4000);
        return;
      }
    }catch(e){console.warn('Gemini extract failed, falling back to regex:',e.message);}
  }
  // Local regex fallback
  const loc=_extractLocal(text);
  if(!loc){showStat('extract-stat','לא נמצא מספר ת.ז. (9 ספרות) בטקסט','err');return;}
  $('p_id').value=loc.id;
  if(loc.name)$('p_name').value=loc.name;
  const ok=validateIsraeliID(loc.id);
  showStat('id-stat',ok?'✓ ת.ז. תקינה':'⚠ ספרת ביקורת שגויה',ok?'ok':'err');
  showStat('extract-stat','✓ שם ות.ז. חולצו בהצלחה','ok');
  setTimeout(()=>showStat('extract-stat','',''),4000);
}

function _saveGeminiKey(){
  const el=$('poa_gemini_key');if(!el)return;
  const k=(el.value||'').trim();
  if(k){localStorage.setItem('poa_gemini_key',k);showStat('gemini-key-stat','✓ המפתח נשמר במכשירך','ok');}
  else{localStorage.removeItem('poa_gemini_key');showStat('gemini-key-stat','המפתח הוסר','');}
}
function _fileIcon(name){
  const n=(name||'').toLowerCase();
  if(/\.pdf$/.test(n))return'📕';
  if(/\.(png|jpe?g|gif|webp|heic|bmp)$/.test(n))return'🖼';
  return'📄';
}
function _showFileBadge(name){
  const box=$('poa-file-badge');if(!box)return;
  const safe=String(name).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  box.style.display='block';
  box.innerHTML='<span class="file-badge">'+_fileIcon(name)+' '+safe+'<button type="button" title="הסר" onclick="_clearFile()">✕</button></span>';
}
function _clearFile(){
  const box=$('poa-file-badge');if(box){box.style.display='none';box.innerHTML='';}
  const ta=$('extract-input');if(ta)ta.value='';
  const inp=$('extract-file');if(inp)inp.value='';
}

// Gemini Vision — for image/scanned-PDF uploads (needs API key)
async function extractWithGeminiVision(file){
  const key=(localStorage.getItem('poa_gemini_key')||'').trim();
  if(!key)throw new Error('no key');
  const parts=[];
  if(file.type.startsWith('image/')){
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    parts.push({inline_data:{mime_type:file.type,data:b64}});
  }else{
    // PDF → render pages to PNG via pdfjs
    const ab=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:ab}).promise;
    for(let i=1;i<=Math.min(pdf.numPages,3);i++){
      const page=await pdf.getPage(i);
      const vp=page.getViewport({scale:1.5});
      const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      parts.push({inline_data:{mime_type:'image/png',data:cv.toDataURL('image/png').split(',')[1]}});
    }
  }
  parts.push({text:_buildPoaPrompt('(הטקסט נמצא בתמונות המצורפות)')});
  let lastErr;
  for(const model of GEMINI_MODELS){
    try{
      const r=await _fetchWithTimeout('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key),
        {method:'POST',headers:{'Content-Type':'application/json'},
         body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0.1,maxOutputTokens:1024,responseMimeType:'application/json'}})},25000);
      if(r.status===404||r.status===503){lastErr=new Error(model+' '+r.status);continue;}
      if(!r.ok)throw new Error('Gemini Vision '+r.status);
      const data=await r.json();
      const raw=(data&&data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0].text)||'';
      return _parseJsonLoose(raw);
    }catch(e){lastErr=e;if(e.name==='AbortError')throw e;}
  }
  throw lastErr||new Error('vision failed');
}

async function extractFromFile(input){
  const file=input.files[0];if(!file)return;
  _showFileBadge(file.name);
  const name=file.name.toLowerCase();
  const isImage=file.type.startsWith('image/');
  const isPdf=name.endsWith('.pdf');
  const hasKey=!!(localStorage.getItem('poa_gemini_key')||'').trim();
  try{
    if(isImage||isPdf){
      // Try text layer first for PDFs (fast, no key needed)
      if(isPdf){
        try{
          const ab=await file.arrayBuffer();
          const pdf=await pdfjsLib.getDocument({data:ab}).promise;
          let txt='';
          for(let i=1;i<=Math.min(pdf.numPages,4);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();txt+=tc.items.map(it=>it.str).join(' ')+'\n';}
          if(txt.trim().length>=40){const ta=$('extract-input');if(ta)ta.value=txt;await extractFromText();return;}
        }catch(e){console.warn('pdf text layer failed:',e.message);}
      }
      // Scanned PDF or image → Gemini Vision
      if(!hasKey){showStat('extract-stat','להעלאת תמונה/סריקה הזן מפתח Gemini למעלה','err');return;}
      showStat('extract-stat','מנתח קובץ עם בינה מלאכותית...','');
      const g=await extractWithGeminiVision(file);
      if(_applyExtracted(g)){showStat('extract-stat','✓ הפרטים חולצו מהקובץ','ok');setTimeout(()=>showStat('extract-stat','',''),4000);}
      else showStat('extract-stat','לא נמצאו פרטים בקובץ','err');
      return;
    }
    // text file
    const reader=new FileReader();
    reader.onload=function(e){const ta=$('extract-input');if(ta)ta.value=e.target.result;extractFromText();};
    reader.readAsText(file,'UTF-8');
  }catch(err){showStat('extract-stat','שגיאה: '+err.message,'err');}
}

function trimmedDataURL(canvas){
  const ctx=canvas.getContext('2d');
  const id=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=id.data,w=canvas.width,h=canvas.height;
  let x0=w,x1=0,y0=h,y1=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>10){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}}
  if(x1<x0)return canvas.toDataURL('image/png');
  const pad=3,tw=x1-x0+pad*2,th=y1-y0+pad*2;
  const tmp=document.createElement('canvas');tmp.width=tw;tmp.height=th;
  tmp.getContext('2d').drawImage(canvas,x0-pad,y0-pad,tw,th,0,0,tw,th);
  return tmp.toDataURL('image/png');
}

(function(){
  let drawing=false,lx=0,ly=0;
  function sc(c){const r=c.getBoundingClientRect();return{x:c.width/r.width,y:c.height/r.height};}
  window.addEventListener('load',()=>{
    const c=document.getElementById('sig-canvas');if(!c)return;
    c.addEventListener('pointerdown',e=>{drawing=true;const s=sc(c);lx=(e.clientX-c.getBoundingClientRect().left)*s.x;ly=(e.clientY-c.getBoundingClientRect().top)*s.y;c.setPointerCapture(e.pointerId);e.preventDefault();});
    c.addEventListener('pointermove',e=>{
      if(!drawing)return;
      const s=sc(c),r=c.getBoundingClientRect();
      const x=(e.clientX-r.left)*s.x,y=(e.clientY-r.top)*s.y;
      const ctx=c.getContext('2d');
      ctx.strokeStyle='#1a3fa8';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();
      lx=x;ly=y;
    });
    c.addEventListener('pointerup',()=>drawing=false);
    c.addEventListener('pointercancel',()=>drawing=false);
  });
})();

function reverseHebrewRTL(str){
  if(!str)return'';
  // fontkit מהפך אוטומטית את כל הטקסט כשמופיעות אותיות עבריות.
  // ללא עברית: מחזיר כמו שהוא (fontkit לא יהפוך).
  // עם עברית: הופכים מראש רק את רצפי המספרים/אנגלית כך שההיפוך של fontkit יחזיר אותם לסדר LTR נכון.
  if(!/[֐-׿]/.test(str)) return str;
  return str.replace(/[\d/a-zA-Z\-]+/g, m => m.split('').reverse().join(''));
}

let _cachedFontBytes=null,_cachedPdfBytes=null;
const FONT_URLS=[
  './Heebo-Bold.ttf',
  'https://fonts.gstatic.com/s/heebo/v28/NGSpv5_NC0k9P_v6ZUCbLRAHxK1Ebiuccg.ttf',
  'https://fonts.gstatic.com/s/assistant/v24/2sDPZGJYnIjSi6H75xkZZE1I0yCmYzzQtgFgEGE.ttf',
  'https://fonts.gstatic.com/s/rubik/v31/iJWZBXyIfDnIV5PNhY1KTN7Z-Yh-4I-1UA.ttf'
];
async function _loadFont(){
  let lastErr;
  for(const u of FONT_URLS){
    try{
      const r=await fetch(u);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const bytes=await r.arrayBuffer();
      if(bytes.byteLength<1000)throw new Error('font too small');
      const head=new Uint8Array(bytes,0,4);
      const tag=String.fromCharCode(...head);
      if(tag!=='\x00\x01\x00\x00'&&tag!=='OTTO'&&tag!=='true'&&tag!=='typ1'){
        throw new Error('not a TTF/OTF: '+tag);
      }
      return bytes;
    }catch(e){lastErr=e;console.warn('font URL failed:',u,e.message);}
  }
  throw new Error('all font sources failed: '+(lastErr&&lastErr.message));
}
async function _loadAssets(){
  if(!_cachedPdfBytes){
    const r=await fetch('./base.pdf');
    if(!r.ok)throw new Error('base.pdf לא נמצא ('+r.status+')');
    _cachedPdfBytes=await r.arrayBuffer();
  }
  if(!_cachedFontBytes)_cachedFontBytes=await _loadFont();
  return {pdfBytes:_cachedPdfBytes,fontBytes:_cachedFontBytes};
}

async function _buildPDFBlob(includeSig){
  const rawName=v('p_name'),rawId=v('p_id'),rawSvc=v('p_service'),rawDate=v('p_date');
  const name=reverseHebrewRTL(rawName);
  const id=reverseHebrewRTL(rawId);
  const service=reverseHebrewRTL(rawSvc);
  const date=reverseHebrewRTL(rawDate);
  const {pdfBytes,fontBytes}=await _loadAssets();
  const pdfDoc=await PDFLib.PDFDocument.load(pdfBytes);
  pdfDoc.registerFontkit(window.fontkit);
  const hebrewFont=await pdfDoc.embedFont(fontBytes);
  const page=pdfDoc.getPage(0);
  const blueColor=PDFLib.rgb(0.102,0.247,0.659);
  const fields=[
    {text:name,   rightEdge:454,y:740,maxWidth:120,size:11},
    {text:id,     rightEdge:309,y:740,maxWidth:48, size:11},
    {text:service,rightEdge:310,y:727,maxWidth:165,size:11},
    {text:date,   rightEdge:364,y:171,maxWidth:48, size:11},
  ];
  for(const f of fields){
    if(!f.text)continue;
    let size=f.size;
    let width=hebrewFont.widthOfTextAtSize(f.text,size);
    while(width>f.maxWidth&&size>7){size-=0.5;width=hebrewFont.widthOfTextAtSize(f.text,size);}
    page.drawText(f.text,{x:f.rightEdge-width,y:f.y,size,font:hebrewFont,color:blueColor});
  }
  if(includeSig&&_sigP){
    let emb;
    if(_sigP.includes('image/png'))emb=await pdfDoc.embedPng(_sigP);
    else emb=await pdfDoc.embedJpg(_sigP);
    const maxW=88,maxH=45;
    const scale=Math.min(maxW/emb.width,maxH/emb.height,0.5);
    const w=emb.width*scale,h=emb.height*scale;
    page.drawImage(emb,{x:458.75-w/2,y:118,width:w,height:h});
  }
  const bytes=await pdfDoc.save();
  return new Blob([bytes],{type:'application/pdf'});
}

async function generateAndSendPDF(isShare=false){
  const isClient=!!$('client-preview');
  const statId=isShare?'sig-stat':'pdf-stat';

    if(isClient)showToast('שגיאה: '+e.message,'err');

  }
}

    +'<div style="font-weight:bold;font-size:16px;color:#7c3aed;margin-bottom:12px">הקובץ החתום מוכן!</div>'
    +'<div style="font-size:13px;color:#444;line-height:1.85;margin-bottom:18px;text-align:right">'
    +'1. הקובץ <strong>ירד כבר</strong> למכשירך<br>'
    +'2. לחץ "פתח וואטסאפ" — הצ׳אט של עוה"ד ייפתח<br>'
    +'3. לחץ 📎 ← <strong>מסמך</strong> ← בחר את הקובץ שירד'
    +'</div>'
    +'<button id="_send-wa-btn" style="background:#25d366;color:#fff;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;margin-bottom:8px">📲 פתח וואטסאפ</button>'
    +'<button id="_send-close-btn" style="background:#f0f0f0;color:#555;border:none;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;width:100%">סגור</button>'
    +'</div>';
  document.body.appendChild(m);
  $('_send-wa-btn').onclick=()=>{window.open(waUrl,'_blank');m.remove();};
  $('_send-close-btn').onclick=()=>m.remove();
}
function _checkHash(){
  const h=location.hash;
  if(h.startsWith('#s='))decodeState(h.slice(3));
}
