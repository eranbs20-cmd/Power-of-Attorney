<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ייפוי כוח — עו"ד ערן בן שושן</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ייפוי כוח">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2d1b69">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#e2e5e9;direction:rtl}
.topbar{background:#2d1b69;color:#fff;padding:12px 24px;font-size:17px;font-weight:bold;
  text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.wrap{display:flex;gap:20px;padding:18px 20px;max-width:680px;margin:0 auto;align-items:flex-start}
.fp{width:100%;background:#fff;border-radius:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);padding-bottom:14px}
.sh{background:#ede8f6;color:#2d1b69;padding:6px 14px;font-size:11.5px;font-weight:bold}
.fg{padding:0 14px}
.fg label{display:block;font-size:11px;color:#444;margin:7px 0 2px;font-weight:bold}
.fg input[type=text],.fg textarea{width:100%;padding:5px 8px;border:1px solid #ccc;
  border-radius:4px;font-size:12px;direction:rtl;font-family:Arial,sans-serif;color:#111;background:#fff}
.fg textarea{resize:vertical;min-height:58px;line-height:1.5}
.fg input:focus,.fg textarea:focus{border-color:#2d1b69;outline:none}
.qbtn{display:inline-block;margin:2px 2px;padding:4px 8px;background:#ede8f6;
  color:#2d1b69;border:1px solid #c0a8e8;border-radius:4px;font-size:10.5px;
  cursor:pointer;font-family:Arial,sans-serif}
.qbtn:hover{background:#d4c5f0}
.btn-g,.btn-r{display:block;width:calc(100% - 28px);margin:8px 14px 3px;
  border:none;border-radius:6px;cursor:pointer;font-family:Arial,sans-serif;font-weight:bold;color:#fff}
.btn-g{background:#27ae60;padding:9px;font-size:13px}
.btn-g:hover{background:#219150}
.btn-r{background:#2d1b69;padding:12px;font-size:14px}
.btn-r:hover{background:#1a0f40}
.stat{font-size:11px;color:#666;text-align:center;min-height:14px;margin:2px 14px}
.stat.ok{color:#27ae60}.stat.err{color:#c0392b}
@media screen and (max-width:768px){
  body{background:#e2e5e9}
  .topbar{font-size:14px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  .wrap{padding:10px;gap:10px}
  .fg input[type=text],.fg textarea{padding:10px;font-size:15px;min-height:44px}
  .btn-g{padding:13px;font-size:15px}
  .btn-r{padding:14px;font-size:16px}
}
</style>
</head>
<body>
<div class="topbar">ייפוי כוח — עו"ד ערן בן שושן</div>
<div class="wrap">
<div class="fp">
  <div class="sh">פרטי המייפה</div>
  <div class="fg">
    <label>שם מלא</label>
    <input type="text" id="p_name" placeholder="שם פרטי ושם משפחה" oninput="sync()">
    <label>מספר ת.ז.</label>
    <input type="text" id="p_id" placeholder="9 ספרות" oninput="formatID(this)" maxlength="9" inputmode="numeric">
    <div class="stat" id="id-stat"></div>
    <label>מהות השירות (אחרי "ל")</label>
    <input type="text" id="p_service" placeholder="לדוגמה: ליישוב סכסוך" oninput="sync()">
    <div style="margin:4px 0 6px">
      <span class="qbtn" onclick="addService('ליישוב סכסוך')">ליישוב סכסוך</span>
      <span class="qbtn" onclick="addService('להגשת תביעה למזונות')">למזונות</span>
      <span class="qbtn" onclick="addService('לטיפול בענייני גירושין')">לגירושין</span>
      <span class="qbtn" onclick="addService('לטיפול בכל ענייני הרכוש והשהות')">לרכוש ושהות</span>
      <span class="qbtn" onclick="addService('לטיפול בכל הענייניים בתחום המשפחה לרבות מזונות, שהות, רכוש וגירושין')">הכל</span>
    </div>
    <label>תאריך</label>
    <input type="text" id="p_date" placeholder="dd/mm/yyyy" oninput="sync()">
  </div>
  <div class="sh" style="margin-top:8px">חילוץ אוטומטי</div>
  <div class="fg">
    <label>הדבק טקסט — יחלץ שם ות.ז. אוטומטית</label>
    <textarea id="extract-input" rows="3" placeholder="הדבק טקסט המכיל שם ומספר ת.ז. (9 ספרות)..." style="font-size:11px"></textarea>
    <div style="display:flex;gap:6px;margin:5px 0 2px">
      <button class="btn-g" style="flex:1;font-size:12px;margin:0" onclick="extractFromText()">🔍 חלץ</button>
      <button class="btn-g" style="flex:1;font-size:12px;margin:0;background:#2d1b69" onclick="$('extract-file').click()">📄 קובץ</button>
    </div>
    <input type="file" id="extract-file" accept=".txt,.rtf,.text" style="display:none" onchange="extractFromFile(this)">
    <div class="stat" id="extract-stat"></div>
  </div>
  <div id="lawyer-tools">
    <div class="sh" style="margin-top:8px">שליחה ב-WhatsApp</div>
    <div class="fg">
      <label>טלפון לקוח (לשליחה ב-WhatsApp)</label>
      <input type="text" id="p_phone" placeholder="05XXXXXXXX" inputmode="tel">
      <button class="btn-g" style="background:#25d366;margin-top:6px" onclick="shareViaWhatsApp()">📲 שלח ללקוח ב-WhatsApp</button>
      <button class="btn-g" style="background:#c97a00;margin-top:4px;font-size:11px" onclick="shareSigLink()">🔗 העתק קישור לחתימה</button>
      <div class="stat" id="share-stat"></div>
    </div>
  </div>
  <div class="sh" style="margin-top:8px">חתימה דיגיטלית</div>
  <div class="fg">
    <button class="btn-g" style="background:#1a6b3a;margin-top:8px" onclick="openSig('p')">✍ חתימת הלקוח</button>
    <div class="stat" id="sig-stat"></div>
  </div>
  <button class="btn-r" onclick="exportPDF()" style="margin-top:10px">⬇ ייצא PDF</button>
  <div class="stat" id="pdf-stat"></div>
</div>
</div>

<div id="sig-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:2000;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:20px;width:90%;max-width:420px;margin:0 auto;box-sizing:border-box;direction:rtl;font-family:Arial,sans-serif">
    <div style="font-weight:bold;font-size:15px;color:#2d1b69;margin-bottom:10px" id="sig-title">חתימת הלקוח</div>
    <div style="font-size:11px;color:#888;margin-bottom:6px">צייר את חתימתך בתיבה:</div>
    <canvas id="sig-canvas" width="700" height="300" style="border:2px solid #c0a8e8;border-radius:8px;touch-action:none;cursor:crosshair;background:#f8faff;display:block;width:100%;height:180px"></canvas>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button onclick="clearSigCanvas()" style="background:#aaa;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px">נקה</button>
      <button onclick="saveSig()" style="background:#1a6b3a;color:#fff;border:none;border-radius:6px;padding:8px 18px;cursor:pointer;font-size:13px;font-weight:bold">שמור ✓</button>
      <button onclick="$('sig-upload-input').click()" style="background:#2d1b69;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px">📁 העלה תמונה</button>
      <input type="file" id="sig-upload-input" accept="image/*" style="display:none" onchange="uploadSigImage(this)">
      <button onclick="closeSigModal()" style="background:#e55;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px">ביטול</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const v=id=>($(id)||{}).value||'';
function sync(){}

function addService(txt){
  const el=$('p_service');
  el.value=el.value?el.value+' / '+txt:txt;
}

function validateIsraeliID(id){
  if(!/^\d{9}$/.test(id))return false;
  let sum=0;
  for(let i=0;i<9;i++){let d=+id[i]*((i%2)+1);if(d>9)d-=9;sum+=d;}
  return sum%10===0;
}

function formatID(el){
  const digits=el.value.replace(/\D/g,'').slice(0,9);
  el.value=digits;
  if(digits.length===9){
    const ok=validateIsraeliID(digits);
    showStat('id-stat',ok?'✓ ת.ז. תקינה':'⚠ ספרת ביקורת שגויה',ok?'ok':'err');
  }else{showStat('id-stat','','');}
}

function extractFromText(){
  const text=v('extract-input');
  const idMatch=text.match(/\d{9}/);
  if(!idMatch){showStat('extract-stat','לא נמצא מספר ת.ז. (9 ספרות) בטקסט','err');return;}
  const rawID=idMatch[0];
  $('p_id').value=rawID;
  const before=text.slice(0,text.indexOf(rawID)).replace(/[,.:;\s]+$/,'').replace(/ת\.?\s*ז\.?\s*$/,'').trim();
  const parts=before.split(/[\s,.:;]+/).filter(Boolean);
  if(parts.length>0)$('p_name').value=parts.slice(-3).join(' ');
  const ok=validateIsraeliID(rawID);
  showStat('id-stat',ok?'✓ ת.ז. תקינה':'⚠ ספרת ביקורת שגויה',ok?'ok':'err');
  showStat('extract-stat','✓ שם ות.ז. חולצו בהצלחה','ok');
  setTimeout(()=>showStat('extract-stat','',''),4000);
}

function extractFromFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){const ta=$('extract-input');if(ta)ta.value=e.target.result;extractFromText();};
  reader.readAsText(file,'UTF-8');input.value='';
}

(function(){
  const d=new Date();
  const today=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  window.addEventListener('DOMContentLoaded',()=>{
    const el=$('p_date');if(el&&!el.value)el.value=today;
    _checkHash();
  });
})();

let _sigRole='p',_sigP='',_sigR='';
function applySig(role,url){
  if(role==='p')_sigP=url;else _sigR=url;
  showStat('sig-stat','✓ חתימה נשמרה','ok');
  closeSigModal();
}
function trimmedDataURL(canvas){
  const ctx=canvas.getContext('2d');
  const id=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=id.data,w=canvas.width,h=canvas.height;
  let x0=w,x1=0,y0=h,y1=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>10){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}}
  if(x1<x0)return canvas.toDataURL('image/png');
  const pad=3,tw=x1-x0+pad*2,th=y1-y0+pad*2;
  const tmp=document.createElement('canvas');tmp.width=tw;tmp.height=th;
  tmp.getContext('2d').drawImage(canvas,x0-pad,y0-pad,tw,th,0,0,tw,th);
  return tmp.toDataURL('image/png');
}
function uploadSigImage(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){applySig(_sigRole,e.target.result);};
  reader.readAsDataURL(file);input.value='';
}
function openSig(role){_sigRole=role;$('sig-title').textContent='חתימת הלקוח';clearSigCanvas();$('sig-modal').style.display='flex';document.body.style.overflow='hidden';}
function closeSigModal(){$('sig-modal').style.display='none';document.body.style.overflow='';}
function clearSigCanvas(){const c=$('sig-canvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);}
function saveSig(){
  const c=$('sig-canvas'),ctx=c.getContext('2d');
  const d=ctx.getImageData(0,0,c.width,c.height).data;
  if(!d.some(v=>v<250&&v>0)){showStat('sig-stat','יש לצייר חתימה תחילה','err');return;}
  applySig(_sigRole,trimmedDataURL(c));
}
(function(){
  let drawing=false,lx=0,ly=0;
  function sc(c){const r=c.getBoundingClientRect();return{x:c.width/r.width,y:c.height/r.height};}
  window.addEventListener('load',()=>{
    const c=document.getElementById('sig-canvas');if(!c)return;
    c.addEventListener('pointerdown',e=>{drawing=true;const s=sc(c);lx=(e.clientX-c.getBoundingClientRect().left)*s.x;ly=(e.clientY-c.getBoundingClientRect().top)*s.y;c.setPointerCapture(e.pointerId);e.preventDefault();});
    c.addEventListener('pointermove',e=>{
      if(!drawing)return;
      const s=sc(c),r=c.getBoundingClientRect();
      const x=(e.clientX-r.left)*s.x,y=(e.clientY-r.top)*s.y;
      const ctx=c.getContext('2d');
      ctx.strokeStyle='#1a3fa8';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();
      lx=x;ly=y;
    });
    c.addEventListener('pointerup',()=>drawing=false);
    c.addEventListener('pointercancel',()=>drawing=false);
  });
})();

function showStat(id,msg,cls){const el=$(id);if(!el)return;el.textContent=msg;el.className='stat'+(cls?' '+cls:'');}

function reverseHebrewRTL(str){
  if(!str)return'';
  return str.split(' ').map(word=>{
    if(/^[\d/a-zA-Z]+$/.test(word))return word;
    return word.split('').reverse().join('');
  }).reverse().join(' ');
}

async function generateAndSendPDF(isShare=false){
  const statId=isShare?'sig-stat':'pdf-stat';
  if(isShare&&!_sigP){showStat(statId,'יש לחתום תחילה','err');return;}
  showStat(statId,'מייצר מסמך...','');
  try{
    const rawName=v('p_name'),rawId=v('p_id'),rawSvc=v('p_service'),rawDate=v('p_date');
    const name=reverseHebrewRTL(rawName);
    const id=reverseHebrewRTL(rawId);
    const service=reverseHebrewRTL(rawSvc);
    const date=reverseHebrewRTL(rawDate);

    const [pdfBytes,fontBytes]=await Promise.all([
      fetch('./base.pdf').then(r=>r.arrayBuffer()),
      fetch('https://fonts.gstatic.com/s/heebo/v22/NGS6v5_NC0k9P9H2TbE.ttf').then(r=>r.arrayBuffer())
    ]);

    const pdfDoc=await PDFLib.PDFDocument.load(pdfBytes);
    pdfDoc.registerFontkit(window.fontkit);
    const hebrewFont=await pdfDoc.embedFont(fontBytes);
    const page=pdfDoc.getPage(0);

    const blueColor=PDFLib.rgb(0.102,0.247,0.659);

    const fields=[
      {text:name,   rightEdge:440,y:733,maxWidth:145,size:12},
      {text:id,     rightEdge:250,y:733,maxWidth:80, size:12},
      {text:service,rightEdge:440,y:708,maxWidth:245,size:12},
      {text:date,   rightEdge:297,y:180,maxWidth:90, size:12},
    ];

    for(const f of fields){
      if(!f.text)continue;
      let size=f.size;
      let width=hebrewFont.widthOfTextAtSize(f.text,size);
      while(width>f.maxWidth&&size>7){size-=0.5;width=hebrewFont.widthOfTextAtSize(f.text,size);}
      page.drawText(f.text,{x:f.rightEdge-width,y:f.y,size,font:hebrewFont,color:blueColor});
    }

    if(_sigP){
      let emb;
      if(_sigP.includes('image/png'))emb=await pdfDoc.embedPng(_sigP);
      else emb=await pdfDoc.embedJpg(_sigP);
      const dim=emb.scale(0.35);
      page.drawImage(emb,{x:360,y:115,width:dim.width,height:dim.height});
    }

    const finalBytes=await pdfDoc.save();
    const pdfBlob=new Blob([finalBytes],{type:'application/pdf'});
    const fileName='יפוי-כוח-'+(rawName||'לקוח')+(isShare?'-חתום':'')+'.pdf';

    if(isShare){
      const file=new File([pdfBlob],fileName,{type:'application/pdf'});
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({title:'ייפוי כוח חתום',text:'שלום, חתמתי על ייפוי כוח.',files:[file]});showStat(statId,'הקובץ נשלח ✓','ok');return;}
        catch(se){if(se.name==='AbortError')return;}
      }
    }

    const burl=URL.createObjectURL(pdfBlob);
    const a=document.createElement('a');a.href=burl;a.download=fileName;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(burl),8000);
    showStat(statId,'הקובץ נשמר ✓','ok');
    setTimeout(()=>showStat(statId,'',''),5000);
    if(isShare)_showSendModal();
  }catch(e){showStat(statId,'שגיאה: '+e.message,'err');}
}

function exportPDF(){generateAndSendPDF(false);}
async function confirmAndSend(){await generateAndSendPDF(true);}

if('serviceWorker'in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

function encodeState(){
  const s={};
  const fields={p_name:'n',p_id:'i',p_service:'s',p_date:'d',p_phone:'ph'};
  Object.entries(fields).forEach(([id,k])=>{const val=v(id);if(val)s[k]=val;});
  return btoa(unescape(encodeURIComponent(JSON.stringify(s))));
}
function decodeState(enc){
  try{
    const s=JSON.parse(decodeURIComponent(escape(atob(enc))));
    const map={n:'p_name',i:'p_id',s:'p_service',d:'p_date',ph:'p_phone'};
    Object.entries(map).forEach(([k,id])=>{if(k in s&&$(id))$(id).value=s[k];});
    _enterClientMode();
  }catch(e){console.error('decodeState:',e);}
}
function _enterClientMode(){
  const attyPanel=document.querySelector('.fp');if(attyPanel)attyPanel.style.display='none';
  const lt=$('lawyer-tools');if(lt)lt.style.display='none';
  if(!$('sign-banner')){
    const b=document.createElement('div');b.id='sign-banner';
    b.style.cssText='background:#1a6b3a;color:#fff;padding:12px 14px;border-radius:8px;font-size:14px;margin:14px;direction:rtl;text-align:center;line-height:1.5';
    b.innerHTML='✍ מצב חתימה<br><span style="font-size:12px;opacity:.85">לחץ "חתימת הלקוח", חתום ואז לחץ שלח</span>';
    document.body.prepend(b);
  }
  if(!$('_float-sign')){
    const fb=document.createElement('button');fb.id='_float-sign';
    fb.style.cssText='display:block;width:calc(100% - 28px);margin:8px 14px 4px;background:#1a6b3a;color:#fff;border:none;border-radius:8px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer;font-family:Arial,sans-serif';
    fb.textContent='✍ חתימת הלקוח';fb.onclick=()=>openSig('p');
    document.body.appendChild(fb);
  }
  if(!$('_float-send')){
    const fb=document.createElement('button');fb.id='_float-send';
    fb.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1a6b3a;color:#fff;border:none;border-radius:12px;padding:15px 28px;font-size:15px;font-weight:bold;cursor:pointer;z-index:1500;box-shadow:0 4px 18px rgba(0,0,0,.35);font-family:Arial,sans-serif;direction:rtl;white-space:nowrap';
    fb.textContent='✅ שלח PDF לעורך הדין';fb.onclick=confirmAndSend;
    document.body.appendChild(fb);
  }
}
function shareViaWhatsApp(){
  const phone=v('p_phone').replace(/\D/g,'');
  const enc=encodeState();
  const url=location.href.split('#')[0]+'#s='+enc;
  const msg='שלום,\nנשלח אליך ייפוי כוח לחתימה דיגיטלית.\nלחץ על הקישור הבא וחתום:\n'+url;
  const waUrl=phone?'https://wa.me/972'+phone.replace(/^0/,'')+'?text='+encodeURIComponent(msg):'https://api.whatsapp.com/send?text='+encodeURIComponent(msg);
  window.open(waUrl,'_blank');
}
function shareSigLink(){
  const enc=encodeState();
  const url=location.href.split('#')[0]+'#s='+enc;
  navigator.clipboard.writeText(url).then(()=>showStat('share-stat','קישור הועתק ✓','ok')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showStat('share-stat','קישור הועתק ✓','ok');
  });
  setTimeout(()=>showStat('share-stat','',''),4000);
}
function _showSendModal(){
  if($('_send-modal'))return;
  const waUrl='https://wa.me/972522499887?text='+encodeURIComponent('שלום עו"ד ערן, חתמתי על ייפוי כוח. מצרף קובץ PDF חתום.');
  const m=document.createElement('div');m.id='_send-modal';
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:3000;display:flex;align-items:center;justify-content:center';
  m.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px 20px;width:90%;max-width:360px;direction:rtl;font-family:Arial,sans-serif;text-align:center">'
    +'<div style="font-size:38px;margin-bottom:8px">✅</div>'
    +'<div style="font-weight:bold;font-size:16px;color:#1a3f7a;margin-bottom:12px">הקובץ החתום מוכן!</div>'
    +'<div style="font-size:13px;color:#444;line-height:1.85;margin-bottom:18px;text-align:right">'
    +'1. הקובץ <strong>ירד כבר</strong> למכשירך<br>'
    +'2. לחץ "פתח וואטסאפ" — הצ׳אט של עוה"ד ייפתח<br>'
    +'3. לחץ 📎 ← <strong>מסמך</strong> ← בחר את הקובץ שירד'
    +'</div>'
    +'<button id="_send-wa-btn" style="background:#25d366;color:#fff;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;margin-bottom:8px">📲 פתח וואטסאפ</button>'
    +'<button id="_send-close-btn" style="background:#f0f0f0;color:#555;border:none;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;width:100%">סגור</button>'
    +'</div>';
  document.body.appendChild(m);
  $('_send-wa-btn').onclick=()=>{window.open(waUrl,'_blank');m.remove();};
  $('_send-close-btn').onclick=()=>m.remove();
}
function _checkHash(){
  const h=location.hash;
  if(h.startsWith('#s='))decodeState(h.slice(3));
}
</script>
